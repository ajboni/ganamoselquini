name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Versionar assets
        run: |
          set -e
          V="${GITHUB_SHA}"
          sed -i "s|\./src/app\.js|./src/app.js?v=${V}|; s|\./src/styles\.css|./src/styles.css?v=${V}|" index.html
          grep -q "app.js?v=${V}" index.html
          grep -q "styles.css?v=${V}" index.html
          grep -nE "src/(app\.js|styles\.css)" index.html

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="-12%" r="95%">
      <stop offset="0%" stop-color="#1b2a44" />
      <stop offset="55%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#080d17" />
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#f5b301" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <text x="600" y="238" text-anchor="middle"
        font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"
        font-size="96" font-weight="bold" fill="#e8eef8">Ganamos el <tspan fill="url(#accent)">Quini</tspan></text>

  <text x="600" y="312" text-anchor="middle"
        font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"
        font-size="40" fill="#93a1b8">Verificador no oficial del Quini 6</text>

  <text x="600" y="382" text-anchor="middle"
        font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"
        font-size="27" fill="#6f7f98">Cargá tus 6 números y mirá si ganaste en los últimos 10 sorteos</text>

  <g font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"
     font-size="34" font-weight="bold" text-anchor="middle">
    <g fill="#162033" stroke="#263349" stroke-width="3">
      <circle cx="350" cy="512" r="42" />
      <circle cx="450" cy="512" r="42" />
      <circle cx="550" cy="512" r="42" />
      <circle cx="650" cy="512" r="42" />
      <circle cx="750" cy="512" r="42" />
      <circle cx="850" cy="512" r="42" />
    </g>
    <g fill="#e8eef8">
      <text x="350" y="524">03</text>
      <text x="450" y="524">04</text>
      <text x="550" y="524">19</text>
      <text x="650" y="524">21</text>
      <text x="750" y="524">31</text>
      <text x="850" y="524">36</text>
    </g>
  </g>
</svg>
